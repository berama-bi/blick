name: Blick Export

on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * *'

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requests
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run scraper
        run: python blick.py

      - name: Verify file
        run: |
          ls -lah
          test -f blick_export.json

      - name: Commit JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add blick_export.json

          git diff --staged --quiet || \
          git commit -m "Update blick_export.json"

          git push

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: blick-export
          path: blick_export.json
